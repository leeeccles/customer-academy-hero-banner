<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      overflow: hidden;
    }

    /* ── Hero banner ───────────────────────────────────────────── */
    .ca-hero {
      display: flex;
      align-items: center;
      position: relative;
      width: 100%;
      height: 280px;
      padding: 32px 40px;
      text-decoration: none;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(110deg, #2e1065 0%, #4338ca 40%, #5b21b6 70%, #7c3aed 100%);
      border-radius: 16px;
      cursor: pointer;
      transition: box-shadow 0.35s ease;
    }
    .ca-hero:hover {
      box-shadow: 0 8px 48px rgba(0, 0, 0, 0.3);
    }
    .ca-hero:focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.6);
      outline-offset: -2px;
    }

    /* Canvas for animated particle network */
    #ca-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    /* Shine sweep on hover */
    .ca-hero::before {
      content: '';
      position: absolute;
      top: 0;
      left: -120%;
      width: 55%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.06), transparent);
      transform: skewX(-18deg);
      transition: left 0.7s ease;
      pointer-events: none;
      z-index: 2;
    }
    .ca-hero:hover::before { left: 160%; }

    /* ── Left content ──────────────────────────────────────────── */
    .ca-content {
      flex: 1;
      position: relative;
      z-index: 2;
      padding-right: 24px;
      align-self: flex-start;
    }

    .ca-eyebrow {
      color: rgba(255, 255, 255, 0.68);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      margin: 0 0 10px 0;
      font-family: inherit;
    }

    .ca-title {
      margin: 0 0 10px 0;
      font-size: 30px;
      font-weight: 800;
      line-height: 1.18;
      letter-spacing: -0.5px;
      color: #ffffff;
      font-family: inherit;
    }

    .ca-desc {
      margin: 0 0 20px 0;
      font-size: 13.5px;
      color: rgba(255, 255, 255, 0.70);
      line-height: 1.6;
      max-width: 400px;
      font-family: inherit;
    }

    /* ── CTA Button ────────────────────────────────────────────── */
    .ca-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 24px;
      border-radius: 28px;
      background: #ffffff;
      color: #3730a3;
      font-size: 14px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      font-family: inherit;
      text-decoration: none;
      transition: background 0.25s, transform 0.2s, box-shadow 0.25s;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.20);
      line-height: 1;
    }
    .ca-btn:hover {
      background: #eef2ff;
      transform: translateY(-1px);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.22);
    }
    .ca-btn-arrow {
      transition: transform 0.2s;
    }
    .ca-btn:hover .ca-btn-arrow { transform: translateX(3px); }

    /* ── Right visual ──────────────────────────────────────────── */
    .ca-visual {
      flex-shrink: 0;
      width: 310px;
      height: 174px;
      position: relative;
      z-index: 2;
      align-self: center;
    }

    .ca-card {
      position: absolute;
      background: rgba(255, 255, 255, 0.13);
      backdrop-filter: blur(24px) saturate(1.3);
      -webkit-backdrop-filter: blur(24px) saturate(1.3);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 14px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.20);
      overflow: hidden;
    }

    .ca-card-main {
      top: 0;
      left: 0;
      width: 222px;
      height: 170px;
      padding: 14px 14px 10px;
    }

    .ca-card-overlay {
      top: 46px;
      left: 156px;
      width: 148px;
      padding: 12px 13px;
    }

    .ca-card-header {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 10px;
    }

    .ca-card-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    .ca-card-title {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.55);
      font-family: inherit;
    }

    /* ── Checklist items ───────────────────────────────────────── */
    .ca-check-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 9px;
    }
    .ca-check-item:last-of-type { margin-bottom: 0; }

    .ca-check-icon {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 10px;
      font-weight: 700;
      color: white;
    }
    .ca-check-icon.checked  { background: rgba(139, 92, 244, 0.85); }
    .ca-check-icon.pending  { border: 1.5px solid rgba(255, 255, 255, 0.35); background: transparent; }

    .ca-check-label {
      font-size: 9.5px;
      color: rgba(255, 255, 255, 0.82);
      font-family: inherit;
      font-weight: 500;
    }

    .ca-progress-bar {
      height: 5px;
      background: rgba(255, 255, 255, 0.14);
      border-radius: 3px;
      margin-top: 10px;
      overflow: hidden;
    }
    .ca-progress-fill {
      height: 100%;
      width: 67%;
      background: linear-gradient(90deg, rgba(139, 92, 244, 0.85), rgba(196, 181, 253, 0.90));
      border-radius: 3px;
    }

    /* ── Reduced motion ────────────────────────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      .ca-hero::before, .ca-btn, .ca-btn-arrow { transition: none; }
    }

    /* ── Responsive: small screen ──────────────────────────────── */
    @media (max-width: 680px) {
      .ca-hero {
        flex-direction: column;
        height: auto;
        min-height: 340px;
        padding: 24px 20px;
        gap: 16px;
        align-items: flex-start;
      }
      .ca-visual { display: none; }
      .ca-title  { font-size: 22px; }
      .ca-desc   { font-size: 13px; max-width: 100%; }
    }
  </style>
</head>
<body>

  <a href="#"
     class="ca-hero"
     aria-label="Customer Academy — Master the Platform with Confidence. Start Learning.">

    <canvas id="ca-canvas" aria-hidden="true"></canvas>

    <!-- Left: text content -->
    <div class="ca-content">
      <p class="ca-eyebrow">Customer Academy</p>
      <h2 class="ca-title">Master the Platform<br>with Confidence</h2>
      <p class="ca-desc">Practical training, expert best practices, and guided learning paths to help you get the most value from our platform.</p>

      <span class="ca-btn">
        Start Learning
        <span class="ca-btn-arrow" aria-hidden="true">↗</span>
      </span>

    </div>

    <!-- Right: dashboard illustration -->
    <div class="ca-visual" aria-hidden="true">

      <!-- Main analytics card -->
      <div class="ca-card ca-card-main">
        <div class="ca-card-header">
          <div class="ca-card-dot" style="background: rgba(167,139,250,0.9);"></div>
          <span class="ca-card-title">Platform Analytics</span>
        </div>
        <svg width="194" height="130" viewBox="0 0 194 130" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="caAreaGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="rgba(139,92,244,0.40)"/>
              <stop offset="100%" stop-color="rgba(139,92,244,0.00)"/>
            </linearGradient>
          </defs>

          <!-- Donut chart -->
          <g transform="translate(44,70)">
            <circle cx="0" cy="0" r="36" stroke="rgba(255,255,255,0.10)" stroke-width="13" fill="none"/>
            <!-- Purple segment -->
            <circle cx="0" cy="0" r="36" stroke="rgba(139,92,244,0.95)" stroke-width="13" fill="none"
              stroke-dasharray="83 143" stroke-dashoffset="0"/>
            <!-- Rose segment -->
            <circle cx="0" cy="0" r="36" stroke="rgba(244,114,182,0.85)" stroke-width="13" fill="none"
              stroke-dasharray="53 173" stroke-dashoffset="-83"/>
            <!-- Blue segment -->
            <circle cx="0" cy="0" r="36" stroke="rgba(96,165,250,0.85)" stroke-width="13" fill="none"
              stroke-dasharray="30 196" stroke-dashoffset="-136"/>
            <!-- Center label -->
            <text x="0" y="-3" text-anchor="middle" fill="white" font-size="14" font-weight="800"
              font-family="'Plus Jakarta Sans', sans-serif">87%</text>
            <text x="0" y="11" text-anchor="middle" fill="rgba(255,255,255,0.50)" font-size="8.5"
              font-weight="500" font-family="'Plus Jakarta Sans', sans-serif">Completion</text>
          </g>

          <!-- Line / area chart -->
          <g transform="translate(98, 8)">
            <!-- Grid lines -->
            <line x1="0" y1="98" x2="92" y2="98" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
            <line x1="0" y1="72" x2="92" y2="72" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
            <line x1="0" y1="46" x2="92" y2="46" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
            <line x1="0" y1="20" x2="92" y2="20" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
            <!-- Area fill -->
            <path d="M0,78 L15,64 L30,72 L46,42 L61,50 L76,24 L92,30 L92,98 L0,98 Z"
              fill="url(#caAreaGrad)"/>
            <!-- Line -->
            <path d="M0,78 L15,64 L30,72 L46,42 L61,50 L76,24 L92,30"
              stroke="rgba(196,181,253,0.95)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <!-- Highlight dots -->
            <circle cx="76" cy="24" r="3.5" fill="rgba(196,181,253,1)" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
            <circle cx="92" cy="30" r="3.5" fill="rgba(196,181,253,1)" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
          </g>
        </svg>
      </div>

      <!-- Overlay checklist card -->
      <div class="ca-card ca-card-overlay">
        <div class="ca-check-item">
          <div class="ca-check-icon checked">✓</div>
          <span class="ca-check-label">Onboarding done</span>
        </div>
        <div class="ca-check-item">
          <div class="ca-check-icon checked">✓</div>
          <span class="ca-check-label">Workflows set up</span>
        </div>
        <div class="ca-check-item">
          <div class="ca-check-icon pending"></div>
          <span class="ca-check-label">Advanced features</span>
        </div>
        <div class="ca-progress-bar">
          <div class="ca-progress-fill"></div>
        </div>
      </div>


    </div>

  </a>

  <script>
    (function () {
      'use strict';

      const canvas  = document.getElementById('ca-canvas');
      const ctx     = canvas.getContext('2d');
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // ── Config ─────────────────────────────────────────────────
      const CFG = {
        nodeCount:   40,
        connectDist: 110,
        signalMax:   5,
        spawnRate:   0.020,
        repelDist:   90,
        repelForce:  0.050,
        maxSpeed:    0.9,
        damping:     0.992,
        orbs: [
          { rx: 0.08, ry: 0.50, r: 120, c: 'rgba(67,56,202,'   },
          { rx: 0.88, ry: 0.38, r: 100, c: 'rgba(109,40,217,'  },
          { rx: 0.48, ry: 0.12, r: 80,  c: 'rgba(91,33,182,'   },
        ],
      };

      let W, H;
      let nodes   = [];
      let signals = [];
      let mouse   = { x: -9999, y: -9999 };
      const t0    = performance.now();

      function resize() {
        W = canvas.width  = canvas.offsetWidth;
        H = canvas.height = canvas.offsetHeight;
      }

      function initNodes() {
        nodes = Array.from({ length: CFG.nodeCount }, () => ({
          x:  Math.random() * W,
          y:  Math.random() * H,
          vx: (Math.random() - 0.5) * 0.40,
          vy: (Math.random() - 0.5) * 0.40,
          r:  Math.random() * 1.4 + 1.0,
          a:  Math.random() * 0.22 + 0.08,
        }));
        signals = [];
      }

      function spawnSignal() {
        if (signals.length >= CFG.signalMax) return;
        const fi   = Math.floor(Math.random() * nodes.length);
        const from = nodes[fi];
        const pool = [];
        for (let i = 0; i < nodes.length; i++) {
          if (i === fi) continue;
          const d = Math.hypot(nodes[i].x - from.x, nodes[i].y - from.y);
          if (d < CFG.connectDist) pool.push({ i, d });
        }
        if (!pool.length) return;
        pool.sort((a, b) => a.d - b.d);
        const ti = pool[Math.floor(Math.random() * Math.min(4, pool.length))].i;
        signals.push({ fi, ti, t: 0, spd: 0.018 + Math.random() * 0.012 });
      }

      function update() {
        for (const n of nodes) {
          const dx   = n.x - mouse.x;
          const dy   = n.y - mouse.y;
          const dist = Math.hypot(dx, dy);
          if (dist < CFG.repelDist && dist > 0.1) {
            const f = ((CFG.repelDist - dist) / CFG.repelDist) * CFG.repelForce;
            n.vx += (dx / dist) * f;
            n.vy += (dy / dist) * f;
          }

          n.vx *= CFG.damping;
          n.vy *= CFG.damping;
          const spd = Math.hypot(n.vx, n.vy);
          if (spd > CFG.maxSpeed) {
            n.vx = (n.vx / spd) * CFG.maxSpeed;
            n.vy = (n.vy / spd) * CFG.maxSpeed;
          }

          n.x += n.vx;
          n.y += n.vy;
          if (n.x < -10)    n.x = W + 10;
          if (n.x > W + 10) n.x = -10;
          if (n.y < -10)    n.y = H + 10;
          if (n.y > H + 10) n.y = -10;
        }

        for (let i = signals.length - 1; i >= 0; i--) {
          signals[i].t += signals[i].spd;
          if (signals[i].t >= 1) signals.splice(i, 1);
        }

        if (Math.random() < CFG.spawnRate) spawnSignal();
      }

      function draw(now) {
        const elapsed = (now - t0) * 0.001;
        ctx.clearRect(0, 0, W, H);

        // 1. Ambient orbs
        for (const orb of CFG.orbs) {
          const ox = orb.rx * W + Math.sin(elapsed * 0.18 + orb.r) * 22;
          const oy = orb.ry * H + Math.cos(elapsed * 0.13 + orb.r) * 14;
          const g  = ctx.createRadialGradient(ox, oy, 0, ox, oy, orb.r);
          g.addColorStop(0, orb.c + '0.28)');
          g.addColorStop(1, orb.c + '0)');
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(ox, oy, orb.r, 0, Math.PI * 2);
          ctx.fill();
        }

        // 2. Connection lines
        ctx.lineWidth = 0.6;
        for (let i = 0; i < nodes.length; i++) {
          for (let j = i + 1; j < nodes.length; j++) {
            const dx = nodes[i].x - nodes[j].x;
            const dy = nodes[i].y - nodes[j].y;
            const d  = Math.sqrt(dx * dx + dy * dy);
            if (d < CFG.connectDist) {
              ctx.strokeStyle = `rgba(255,255,255,${(1 - d / CFG.connectDist) * 0.09})`;
              ctx.beginPath();
              ctx.moveTo(nodes[i].x, nodes[i].y);
              ctx.lineTo(nodes[j].x, nodes[j].y);
              ctx.stroke();
            }
          }
        }

        // 3. Signal pulses
        for (const sig of signals) {
          const from = nodes[sig.fi];
          const to   = nodes[sig.ti];
          const sx   = from.x + (to.x - from.x) * sig.t;
          const sy   = from.y + (to.y - from.y) * sig.t;
          const g    = ctx.createRadialGradient(sx, sy, 0, sx, sy, 5);
          g.addColorStop(0,   'rgba(255,255,255,0.90)');
          g.addColorStop(0.4, 'rgba(167,139,250,0.55)');
          g.addColorStop(1,   'rgba(167,139,250,0)');
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(sx, sy, 5, 0, Math.PI * 2);
          ctx.fill();
        }

        // 4. Nodes
        for (const n of nodes) {
          ctx.fillStyle = `rgba(255,255,255,${n.a})`;
          ctx.beginPath();
          ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function loop(now) {
        update();
        draw(now);
        requestAnimationFrame(loop);
      }

      const ro = new ResizeObserver(() => { resize(); initNodes(); });
      ro.observe(canvas.parentElement);

      window.addEventListener('mousemove', e => {
        const rect = canvas.getBoundingClientRect();
        mouse.x = e.clientX - rect.left;
        mouse.y = e.clientY - rect.top;
      });
      window.addEventListener('touchmove', e => {
        if (e.touches[0]) {
          const rect = canvas.getBoundingClientRect();
          mouse.x = e.touches[0].clientX - rect.left;
          mouse.y = e.touches[0].clientY - rect.top;
        }
      }, { passive: true });
      window.addEventListener('mouseleave', () => {
        mouse.x = -9999;
        mouse.y = -9999;
      });

      resize();
      initNodes();

      if (reduced) {
        draw(t0);
      } else {
        requestAnimationFrame(loop);
      }
    })();
  </script>

</body>
</html>
